[package]
name = "onecast-core"
version = "0.1.0"
edition = "2024"
description = "Memory-safe Rust core for Xbox Remote Play (xHome) on macOS"

[lib]
name = "onecast_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
bytes = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
str0m = { version = "0.26", default-features = false, features = ["apple-crypto"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tracing = "0.1"
uniffi = { version = "0.32", features = ["cli"] }
uuid = { version = "1.15", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"
