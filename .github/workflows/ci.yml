name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Rust Core + Swift macOS App)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy, rustfmt

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Run Rust Unit Tests
        run: |
          cd core
          cargo test --verbose

      - name: Run Rust Clippy
        run: |
          cd core
          cargo clippy -- -D warnings || cargo clippy

      - name: Build Rust Engine & Generate UniFFI Scaffolding
        run: |
          chmod +x scripts/build-rust.sh
          ./scripts/build-rust.sh

      - name: Build Swift macOS App
        run: |
          cd app
          swift build -c release

      - name: Run Swift Unit Tests
        run: |
          cd app
          swift test --verbose
